<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 590" width="1010" height="590" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <style>
      .t{font-size:13px;fill:#0f172a}
      .s{font-size:11px;fill:#475569;font-style:italic}
      .h{font-size:14px;font-weight:bold;fill:#0f172a}
      .l{font-size:11.5px;fill:#334155;paint-order:stroke;stroke:#fff;stroke-width:4px}
      .n{fill:#f8fafc;stroke:#334155;stroke-width:1.5}
      .art{fill:#fff;stroke:#64748b;stroke-width:1}
    </style>
  </defs>
  <rect width="1010" height="590" fill="#ffffff"/>
  <text x="505" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Diagrama de Implantação - Moeda Estudantil</text>

  <!-- Dispositivo do usuário -->
  <rect class="n" x="30" y="190" width="230" height="190"/>
  <text class="s" x="145" y="210" text-anchor="middle">«device»</text>
  <text class="h" x="145" y="226" text-anchor="middle">Dispositivo do usuário</text>
  <rect class="n" x="50" y="245" width="190" height="115" fill="#eef2ff"/>
  <text class="s" x="145" y="263" text-anchor="middle">«execution environment»</text>
  <text class="h" x="145" y="279" text-anchor="middle">Navegador Web</text>
  <rect class="art" x="65" y="294" width="160" height="50"/>
  <text class="t" x="145" y="315" text-anchor="middle">HTML / CSS</text>
  <text class="t" x="145" y="331" text-anchor="middle">(templates renderizados)</text>

  <!-- Render cloud -->
  <rect x="330" y="60" width="430" height="500" rx="40" fill="#f1f5f9" stroke="#334155" stroke-width="1.5" stroke-dasharray="7 4"/>
  <text class="s" x="545" y="88" text-anchor="middle">«cloud»</text>
  <text class="h" x="545" y="106" text-anchor="middle">Render</text>

  <!-- Web Service -->
  <rect class="n" x="355" y="125" width="380" height="235" fill="#ecfdf5"/>
  <text class="s" x="545" y="145" text-anchor="middle">«Python 3.12»</text>
  <text class="h" x="545" y="162" text-anchor="middle">Web Service (gunicorn - WSGI)</text>
  <rect class="art" x="375" y="178" width="340" height="40"/>
  <text class="t" x="545" y="203" text-anchor="middle">config (settings, urls, wsgi)</text>
  <rect class="art" x="375" y="228" width="340" height="60"/>
  <text class="t" x="545" y="249" text-anchor="middle">cadastros</text>
  <text class="t" x="545" y="267" text-anchor="middle">(models, views, forms, services, templates)</text>
  <rect class="art" x="375" y="298" width="340" height="40"/>
  <text class="t" x="545" y="323" text-anchor="middle">WhiteNoise (arquivos estáticos)</text>

  <!-- PostgreSQL -->
  <rect class="n" x="355" y="425" width="380" height="110" fill="#fefce8"/>
  <text class="s" x="545" y="445" text-anchor="middle">«Render Postgres»</text>
  <text class="h" x="545" y="462" text-anchor="middle">PostgreSQL</text>
  <rect class="art" x="425" y="476" width="240" height="44"/>
  <text class="t" x="545" y="495" text-anchor="middle">Esquema</text>
  <text class="t" x="545" y="511" text-anchor="middle">(migrations Django)</text>

  <!-- Provedor de e-mail -->
  <rect class="n" x="820" y="170" width="170" height="125" fill="#fff7ed"/>
  <text class="s" x="905" y="192" text-anchor="middle">«cloud» «API HTTP»</text>
  <text class="h" x="905" y="210" text-anchor="middle">Provedor de e-mail</text>
  <rect class="art" x="835" y="228" width="140" height="48"/>
  <text class="t" x="905" y="248" text-anchor="middle">Resend / Brevo</text>
  <text class="t" x="905" y="264" text-anchor="middle">(serviço transacional)</text>

  <!-- Cron -->
  <rect class="n" x="820" y="415" width="170" height="125" fill="#faf5ff"/>
  <text class="s" x="905" y="437" text-anchor="middle">«máquina local»</text>
  <text class="h" x="905" y="455" text-anchor="middle">Administrador (execução manual)</text>
  <rect class="art" x="835" y="473" width="140" height="48"/>
  <text class="t" x="905" y="494" text-anchor="middle">manage.py</text>
  <text class="t" x="905" y="510" text-anchor="middle">creditar_semestre</text>

  <!-- GitHub -->
  <rect class="n" x="30" y="440" width="230" height="100"/>
  <text class="s" x="145" y="460" text-anchor="middle">«VCS»</text>
  <text class="h" x="145" y="477" text-anchor="middle">Repositório GitHub</text>
  <rect class="art" x="50" y="490" width="190" height="38"/>
  <text class="t" x="145" y="513" text-anchor="middle">Código-fonte + render.yaml</text>

  <!-- Associações -->
  <line x1="260" y1="285" x2="355" y2="250" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
  <text class="l" x="308" y="258" text-anchor="middle">HTTPS (443)</text>

  <line x1="545" y1="360" x2="545" y2="425" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
  <text class="l" x="640" y="388" text-anchor="middle">TCP 5432 (DATABASE_URL, TLS)</text>

  <line x1="735" y1="232" x2="820" y2="232" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
  <text class="l" x="778" y="222" text-anchor="middle">HTTPS (API)</text>
  <text class="l" x="778" y="252" text-anchor="middle">cupom e avisos</text>

  <line x1="820" y1="480" x2="735" y2="480" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
  <text class="l" x="778" y="462" text-anchor="middle">TCP 5432</text><text class="l" x="778" y="500" text-anchor="middle">(conexão externa)</text>

  <line x1="260" y1="490" x2="355" y2="345" stroke="#334155" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text class="l" x="250" y="415" text-anchor="middle">deploy automático</text>
  <text class="l" x="250" y="431" text-anchor="middle">(collectstatic + migrate)</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
