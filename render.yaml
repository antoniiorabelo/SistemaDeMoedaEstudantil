databases:
  - name: moeda-estudantil-db
    plan: free
    databaseName: moeda_estudantil
    user: moeda

services:
  - type: web
    name: moeda-estudantil
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: moeda-estudantil-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: DEFAULT_FROM_EMAIL
        value: "Moeda Estudantil <noreply@seudominio.com>"
      - key: EMAIL_BACKEND
        sync: false
      - key: RESEND_API_KEY
        sync: false